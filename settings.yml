server:
  secret_key: "259f0f5eef5eeb26cc3e44fddc89e4048813d91d26314fe40a281f05e5d08507"  # generated random
  base_url: "https://searxng-production-7512.up.railway.app"
  
ui:
  static_use_hash: true
  theme: simple-dark
  language: "en"
  results_on_new_tab: true
  center_alignment: true
  advanced_search: true
  
search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en"
  languages:
    - "en"
    - "id"
    - "de"
    - "fr"
    - "es"
  categories:
    - general
    - images
    - videos
    - news
    - map
    - science
  max_results: 20
  image_proxy: true
  
engines:
  - name: google
    engine: google
    shortcut: g
    categories: [general]
    timeout: 3.0
  
  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    categories: [general]
    timeout: 3.0
  
  - name: bing
    engine: bing
    shortcut: b
    categories: [general, images, videos, news]
    timeout: 3.0
  
  - name: youtube
    engine: youtube
    shortcut: yt
    categories: [videos]
    timeout: 3.0
  
  - name: github
    engine: github
    shortcut: gh
    categories: [general]
    timeout: 3.0
  
  - name: wikipedia
    engine: wikipedia
    shortcut: w
    categories: [general]
    timeout: 3.0
  
  - name: arxiv
    engine: arxiv
    shortcut: ar
    categories: [science]
    timeout: 5.0
  
  - name: reddit
    engine: reddit
    shortcut: r
    categories: [general]
    timeout: 3.0
  
  - name: duckduckgo_images
    engine: duckduckgo_images
    shortcut: di
    categories: [images]
    timeout: 3.0
  
  - name: google_images
    engine: google_images
    shortcut: gi
    categories: [images]
    timeout: 3.0
  
  - name: google_videos
    engine: google_videos
    shortcut: gv
    categories: [videos]
    timeout: 3.0
  
  - name: openstreetmap
    engine: openstreetmap
    shortcut: osm
    categories: [map]
    timeout: 5.0

outgoing:
  request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 100
  verify: true
  
server:
  limiter: true
  max_request_time: 10.0
  
use_default_settings: false
